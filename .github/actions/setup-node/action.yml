name: Setup node
description: Spins up node env and installs dependencies
inputs:
  dir:
    required: false
    description: Dependencies directory
    default: .
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
    - name: Install
      run: make setup
      shell: bash
